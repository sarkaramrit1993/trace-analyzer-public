services:
  # SeaweedFS: local S3-compatible store for the cold tier (gzipped JSON).
  # Opt-in via the "cold" profile. "weed mini" runs master, volume, filer and
  # the S3 gateway in one process and creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: ["cold"]
    command: mini -dir=/data -bucket=trace-cold
    ports:
      - "19000:8333"
    environment:
      AWS_ACCESS_KEY_ID: tracedev
      AWS_SECRET_ACCESS_KEY: tracedevsecret
    volumes:
      - s3-data:/data
    healthcheck:
      # Healthy only once the bucket exists (filer lists /buckets/<name>).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/buckets/trace-cold/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Trace Analyzer (connects to SSE stream, processes spans)
  analyzer:
    build: ./analyzer
    # Shutdown flushes pending traces and saves every combination's baselines.
    stop_grace_period: 30s
    ports:
      - "18080:8080"
    environment:
      SSE_ENDPOINT: "disabled"
      API_PORT: 8080
      DATA_PATH: /app/data
      CLEAN_START: "false"
      HOT_RETENTION_MINUTES: 15
      WARM_RETENTION_MINUTES: 60
      TRACE_ASSEMBLY_TIMEOUT_SECS: 180  # 3 minutes window for trace assembly
      DEVIATION_THRESHOLD: 0.1
      ANOMALY_ZSCORE_THRESHOLD: 3.5
      SLIDING_WINDOW_DURATION: "24h"  # Options: "1h", "24h" (daily), "168h" (weekly), "720h" (monthly)
      # Tag keys read for grouping, comma-separated. Empty keeps the built-in keys.
      SERVICE_IDENTITY_TAG_KEYS: "${SERVICE_IDENTITY_TAG_KEYS:-}"
      SCOPE1_TAG_KEYS: "${SCOPE1_TAG_KEYS:-}"
      SCOPE2_TAG_KEYS: "${SCOPE2_TAG_KEYS:-}"
      SCOPE3_TAG_KEYS: "${SCOPE3_TAG_KEYS:-}"
      # Cold tier is off unless S3_ENDPOINT is set, e.g.
      # S3_ENDPOINT=http://s3:8333 docker compose --profile cold up
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ACCESS_KEY: tracedev
      S3_SECRET_KEY: tracedevsecret
      S3_BUCKET: trace-cold
      S3_USE_SSL: "false"
    volumes:
      - trace-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Web UI Dashboard
  web-ui:
    build: ./web-ui
    depends_on:
      analyzer:
        condition: service_healthy
    ports:
      - "14000:4000"
    environment:
      VITE_API_URL: http://localhost:18080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/config.js"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  trace-data:
  s3-data:
