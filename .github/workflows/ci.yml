name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails on internal names that must not appear in tracked files. The
      # bracket classes keep this workflow from matching its own patterns.
      - name: Forbidden strings
        run: |
          if git grep -nIi -E 's[f]dc|m[o]nc\.identifier|f[u]nctional_domain|m[o]nitoring-tac|t[a]c-s3'; then
            echo "Forbidden strings found in tracked files" >&2
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analyzer/go.mod
          cache-dependency-path: analyzer/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -race

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt pytest
      - run: pytest scripts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: docker compose build
